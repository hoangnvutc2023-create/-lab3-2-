<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát vườn cà phê – hồ tiêu</title>
<style>
:root{--bg:#eef1ec;--panel:#fff;--ink:#1d2a22;--mute:#6b7a70;--line:#d5ddd5;--leaf:#2f7d4f;--water:#2b6cb0;--warn:#c4821a;--bad:#b83a3a}
@media (prefers-color-scheme:dark){:root{--bg:#141b17;--panel:#1d2722;--ink:#e6ede8;--mute:#93a399;--line:#2e3b34;--leaf:#5dbb85;--water:#6aa8e8;--warn:#e0a548;--bad:#e06b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:20px;max-width:1000px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:18px}
h1{font-size:1.35rem;margin:0}
#conn{font-size:.9rem;color:var(--mute)}
#conn::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px}
#conn.ok::before{background:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.label{color:var(--mute);font-size:.9rem}
.value{font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.value small{font-size:1.1rem;font-weight:400;color:var(--mute);margin-left:4px}
.hum .value{color:var(--water)} .temp .value{color:var(--warn)} .mist .value{color:var(--leaf)}
#humState{font-size:.9rem;margin-top:4px;color:var(--mute)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.charts .card{height:260px;position:relative}
.ctrl{display:flex;gap:12px;flex-wrap:wrap}
button{flex:1 1 180px;padding:14px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<header>
  <h1>Vườn cà phê – hồ tiêu: giám sát môi trường</h1>
  <span id="conn">Đang kết nối broker…</span>
</header>

<section class="grid">
  <div class="card temp"><div class="label">Nhiệt độ</div><div class="value"><span id="temp">--</span><small>°C</small></div></div>
  <div class="card hum"><div class="label">Độ ẩm (mục tiêu 40–60%)</div><div class="value"><span id="hum">--</span><small>%</small></div><div id="humState">Chưa có dữ liệu</div></div>
  <div class="card mist"><div class="label">Máy phun sương</div><div class="value"><span id="mist">0</span><small>% công suất</small></div></div>
</section>

<section class="charts">
  <div class="card"><canvas id="chT"></canvas></div>
  <div class="card"><canvas id="chH"></canvas></div>
</section>

<section class="ctrl">
  <button id="btnPump" type="button">Máy bơm: TẮT</button>
  <button id="btnFan"  type="button">Quạt: TẮT</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ===== Cấu hình: phải trùng BASE trong code ESP32 =====
const BASE = "lab3/de2/nvhoang01";
const BROKER = "wss://broker.hivemq.com:8884/mqtt";   // MQTT over WebSocket (TLS)
const MAXPTS = 30;

// ===== Biểu đồ =====
function makeChart(id, label, color, min, max, bands){
  const ds = [{label, data:[], borderColor:color, backgroundColor:color, tension:.3, pointRadius:2}];
  (bands||[]).forEach(b => ds.push({label:"Ngưỡng "+b, data:[], borderColor:"#999", borderDash:[5,4], pointRadius:0, borderWidth:1, _y:b}));
  return new Chart(document.getElementById(id), {
    type:"line", data:{labels:[], datasets:ds},
    options:{responsive:true, maintainAspectRatio:false, animation:false,
      scales:{y:{min,max}}, plugins:{legend:{labels:{filter:i=>i.datasetIndex===0}}}}
  });
}
const chT = makeChart("chT","Nhiệt độ (°C)","#c4821a");
const chH = makeChart("chH","Độ ẩm (%)","#2b6cb0",0,100,[40,60]);
function push(ch, v){
  const t = new Date().toLocaleTimeString("vi-VN");
  ch.data.labels.push(t);
  ch.data.datasets.forEach((d,i)=>d.data.push(i===0 ? v : d._y));
  if(ch.data.labels.length>MAXPTS){ch.data.labels.shift();ch.data.datasets.forEach(d=>d.data.shift());}
  ch.update();
}

// ===== MQTT =====
const $ = id => document.getElementById(id);
const client = mqtt.connect(BROKER, {clientId:"web-"+Math.random().toString(16).slice(2,8), reconnectPeriod:3000});
const state = {pump:false, fan:false};
let gotData = false, noDataTimer = null;

client.on("connect", () => {
  $("conn").textContent = "Đã kết nối broker"; $("conn").classList.add("ok");
  client.subscribe([BASE+"/data", BASE+"/state/pump", BASE+"/state/fan"] , (err, granted) => {
    console.log("[MQTT] subscribe:", err || granted);
    if (err) $("humState").textContent = "Lỗi subscribe: " + err.message;
  });
  clearTimeout(noDataTimer);
  noDataTimer = setTimeout(() => {
    if (!gotData) $("humState").textContent = "Đã kết nối nhưng chưa nhận dữ liệu – kiểm tra ESP32 / topic " + BASE + "/data";
  }, 10000);
});
client.on("error", e => { console.error("[MQTT] error:", e); $("conn").textContent = "Lỗi MQTT: " + e.message; });
client.on("close", () => { $("conn").textContent = "Mất kết nối, đang thử lại…"; $("conn").classList.remove("ok"); });

client.on("message", (topic, payload) => {
  const msg = payload.toString();
  console.log("[MQTT] nhận", topic, msg);
  try {
  if (topic === BASE+"/data") {
    gotData = true;
    const d = JSON.parse(msg);
    $("temp").textContent = d.temp.toFixed(1);
    $("hum").textContent  = d.hum.toFixed(1);
    $("mist").textContent = d.mist;
    $("humState").textContent = d.hum < 40 ? "Dưới ngưỡng – đang bù ẩm" : d.hum > 60 ? "Trên ngưỡng 60%" : "Ổn định";
    push(chT, d.temp); push(chH, d.hum);
  } else if (topic === BASE+"/state/pump") { setBtn("pump", msg === "ON"); }
  else if (topic === BASE+"/state/fan")    { setBtn("fan",  msg === "ON"); }
  } catch (e) {
    console.error("[WEB] lỗi xử lý", topic, msg, e);
    $("humState").textContent = "Lỗi xử lý dữ liệu: " + e.message + " (xem Console F12)";
  }
});

function setBtn(key, on){
  state[key] = on;
  const b = $(key === "pump" ? "btnPump" : "btnFan");
  b.classList.toggle("on", on);
  b.textContent = (key === "pump" ? "Máy bơm: " : "Quạt: ") + (on ? "BẬT" : "TẮT");
}
function toggle(key){ client.publish(BASE+"/cmd/"+key, state[key] ? "OFF" : "ON"); }
$("btnPump").onclick = () => toggle("pump");
$("btnFan").onclick  = () => toggle("fan");
</script>
</body>
</html>
